# =====================================================================
# Identidade visual do Customizr: UMA fonte das cores dos temas, pro programa de PC (JavaFX) e pro site (web).
#
# Depois de mudar algo aqui, rode (na raiz do repositorio):
#     java design/GerarTokens.java
# Ele reescreve:
#   - mesa-pc/vtt-client/src/main/resources/style.css   (bloco entre tokens:inicio e tokens:fim, tema padrao)
#   - mesa-pc/vtt-client/src/main/resources/theme-*.css  (os outros temas, no PC)
#   - design/web/tokens.css                              (todos os temas, pro site: variaveis --c-*)
#
# Cada tema define 11 cores base. Os tons intermediarios saem das regras "derivado.*" (mesma conta do derive() do
# JavaFX) e as transparencias das regras "alfa.*". Um tema pode fixar qualquer tom com "<tema>.<nome>=#RRGGBB".
# Detalhes que nao sao cor (ex.: a faixa arco-iris do Orgulho) vao em design/temas-extra/<tema>.fx.css (PC) e
# <tema>.web.css (site); o gerador cola no fim do tema.
# =====================================================================

temas=fogueira,claro,escuro,gotico,scifi,cyberpunk,apocalipse,dnd,olddragon,tormenta,orgulho,noir
padrao=fogueira

# --- tons calculados: nome = cor base, porcentagem (positivo clareia, negativo escurece) ---
derivado.bg-deep=bg,-15
derivado.bg-deep2=bg,-25
derivado.bg-input=bg,4
derivado.bg-alt=bg,7
derivado.surface-0=surface,-6
derivado.surface-1=surface,6
derivado.surface-1b=surface,6
derivado.surface-2=surface,10
derivado.surface-2b=surface,10
derivado.surface-3=surface,14
derivado.surface-4=surface,20
derivado.raised-2=raised,8
derivado.raised-2b=raised,8
derivado.raised-3=raised,20
derivado.raised-3b=raised,22
derivado.raised-armed=accent-deep,-15
derivado.border-2=border,15
derivado.border-3=border,30
derivado.accent-deep-2=accent-deep,15
derivado.accent-deep-3=accent-deep,8
derivado.accent-deep-4=accent-deep,30
derivado.accent-deep-5=accent-deep,-30
derivado.accent-text-2=accent-text,40
derivado.accent-text-3=accent-text,25
derivado.accent-text-4=accent-text,10
derivado.text-2=text,-10
derivado.text-3=text,-25
derivado.muted-2=muted,-10
derivado.muted-3=muted,-18
derivado.muted-3b=muted,-20
derivado.muted-4=muted,-28
derivado.danger-text=danger,30
derivado.success-text=success,40
derivado.success-bg=success,-70

# --- cores iguais em todos os temas (um tema pode trocar com "<tema>.<nome>") ---
geral.private=#9B6BDF

# --- transparencias: nome = cor base, alfa em hexadecimal (00 = invisivel, FF = cheio) ---
alfa.private-bg=private,26
alfa.accent-88=accent,88
alfa.accent-66=accent,66
alfa.accent-55=accent,55
alfa.accent-22=accent,22
alfa.surface-glass=surface,F2
alfa.surface-glass2=surface,EE
alfa.surface-glass3=surface,EE

