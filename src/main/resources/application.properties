spring.application.name=system
# Configuracao local fica no arquivo .env na raiz do projeto (fora do git; modelo em .env.example).
# Em producao (Railway) as mesmas chaves vem das variaveis de ambiente.
spring.config.import=optional:file:.env[.properties]
# Sem SPRING_DATASOURCE_URL: o mesmo endereco de sempre do Railway (o que ja estava no ar). Pra testar no seu PC
# sem mexer no banco de verdade, ponha no .env um banco H2 local (ver .env.example).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://monorail.proxy.rlwy.net:49263/${PGDATABASE:railway}}
spring.datasource.username=${PGUSER:}
spring.datasource.password=${PGPASSWORD:}
spring.jpa.hibernate.ddl-auto=update
management.endpoints.web.exposure.include=env
spring.sql.init.mode=never
# Chave dos logins. A antiga estava publica no repositorio, entao saiu daqui. Sem JWT_SECRET o servidor sobe com uma
# chave temporaria aleatoria (segura, mas todo mundo precisa entrar de novo quando o servidor reinicia).
jwt.secret=${JWT_SECRET:}
# 10 horas
jwt.expiration=36000000